name: reverse_number_lookup
description: "Reverse Number Lookup - NumTrace"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Navigation ────────────────────────────────
  go_router: ^17.3.0

  # ── Dependency Injection ──────────────────────
  get_it: ^9.2.1

  # ── Networking ────────────────────────────────
  dio: ^5.11.0
  json_annotation: ^4.12.0

  # ── Local Database (SQLite ORM) ───────────────
  sqflite: ^2.4.1
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # ── Preferences ───────────────────────────────
  shared_preferences: ^2.5.5

  # ── Connectivity ──────────────────────────────
  connectivity_plus: ^7.3.1

  # ── Permissions ───────────────────────────────
  permission_handler: ^12.0.3

  # ── Phone / Contacts ──────────────────────────
  flutter_contacts: ^1.1.8
  call_log: ^6.0.1
  url_launcher: ^6.3.2

  # ── Country Picker ────────────────────────────
  country_picker: ^2.0.28

  # ── Image ─────────────────────────────────────
  cached_network_image: ^3.4.1

  # ── Typography ────────────────────────────────
  google_fonts: ^8.2.0

  # ── Animations ────────────────────────────────
  flutter_animate: ^4.5.2
  lottie: ^3.5.1

  # ── UI Helpers ────────────────────────────────
  shimmer: ^3.0.0
  gap: ^3.0.1

  # ── Firebase ──────────────────────────────────────────────────────
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_remote_config: ^5.3.4
  firebase_auth: ^5.5.1

  # ── Ads ───────────────────────────────────────────────────────────
  google_mobile_ads: ^5.3.0

  # ── In-App Review ─────────────────────────────────────────────────
  in_app_review: 2.0.9

  # ── Share ─────────────────────────────────────────────────────
  share_plus: ^10.1.4

  # ── Package Info ──────────────────────────────────────────────
  package_info_plus: ^8.3.0

  # ── Icons ─────────────────────────────────────
  cupertino_icons: ^1.0.9
  fpdart: ^1.2.0
  phone_numbers_parser: ^9.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ">=2.0.0 <2.15.2"
  drift_dev: ^2.20.0
  json_serializable: ^6.8.0


flutter:
  uses-material-design: true

  assets:
    - assets/animations/ic_splash.json
    - assets/animations/coin.json

